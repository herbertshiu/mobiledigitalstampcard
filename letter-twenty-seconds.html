        <p class="letter-meta"><strong>來信六</strong> · 新會員</p>
        <h1>二十秒完成登記，換一個好用的會員 App</h1>
        <div class="letter-body">
          <p>親愛的店老板：</p>
          <p>我願意花二十秒掃碼入會，條件很簡單：登記後 App 立刻顯示「已集 1 分，滿 10 分換 XX」。之後每次來，我自己打開就看，不用尷尬問「我幾分」。</p>
          <p>好的會員卡 App 讓我覺得這二十秒是「買一個長期便利」，不是「幫店做資料」。我會為便利成為常客。</p>
          <p class="letter-sign">—— 一個不喜歡每次問積分的人</p>
        </div>
        <aside class="letter-aside"><strong>給店東</strong>登記後第一屏體驗決定顧客是否持續用 App。投資順暢的會員系統 App，等於買下顧客「願意再看第二次」的習慣。</aside>
