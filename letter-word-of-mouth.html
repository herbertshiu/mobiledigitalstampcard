        <h1>我會跟閨蜜說：那家店 App 很好用</h1>
        <div class="letter-body">
          <p>親愛的店老板：</p>
          <p>閨蜜問哪間店值得常去，我會說：「那家餐廳 App 清楚，積分不會丟，結帳也快。」我不會轉發滿減海報，但我會教她怎麼用那家店的會員 App 入會。</p>
          <p>對我來說，數位會員制度代表「這家店跟得上時代、尊重我的時間」。這種店我願意帶朋友去——口碑就是這樣來的。</p>
          <p class="letter-sign">—— 一個把體驗當禮物送朋友的人</p>
        </div>
        <aside class="letter-aside"><strong>給店東</strong>順暢的會員 App 是免費的推廣員。顧客主動教朋友用 App，比任何廣告更可信。</aside>
