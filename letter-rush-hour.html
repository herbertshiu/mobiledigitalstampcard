        <p class="letter-meta"><strong>來信二</strong> · 午餐排隊的人</p>
        <h1>尖峰時段，有 App 反而更快</h1>
        <div class="letter-body">
          <p>親愛的店老板：</p>
          <p>午市最怕櫃檯講一堆規則。現在我常去的那家，我說手機尾四碼，員工對一下會員系統，螢幕顯示積分、自動入帳——比翻紙本集點卡、找印章快多了。</p>
          <p>所以尖峰時我反而希望你有數位會員：少講話、少找卡、後面隊伍也開心。這不是冷冰冰，是有效率。</p>
          <p class="letter-sign">—— 一個不想讓後面的人等太久的人</p>
        </div>
        <aside class="letter-aside"><strong>給店東</strong>會員 App 在繁忙時段能縮短結帳對話，員工與顧客都省力——是營運工具，不是累贅。</aside>
