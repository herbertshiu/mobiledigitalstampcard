        <h1>App 幫我算積分，我就不用猜</h1>
        <div class="letter-body">
          <p>親愛的店老板：</p>
          <p>牆上寫滿滿雙倍、假日不算，我帶著小孩根本沒空算。自從常用那家店的會員 App，打開就看到「再消費兩次可換小食」——我不用當數學家，也知道下次為何要來。</p>
          <p>會員制度寫在牆上我會忽略；寫在 App 裡我會看。這對店舖是好事：顧客真的會朝兌換目標走。</p>
          <p class="letter-sign">—— 一個腦袋已經很滿的媽媽</p>
        </div>
        <aside class="letter-aside"><strong>給店東</strong>會員 App 把規則「視覺化」，比海報更能驅動兌換與回訪。這是數位會員制度的核心價值。</aside>
