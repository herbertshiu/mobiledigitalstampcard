        <h1>有用的 App 提醒，我會開</h1>
        <div class="letter-body">
          <p>親愛的店老板：</p>
          <p>我會退訂每晚促銷的店，但會保留「差 1 分可兌換」「生日券已入帳」「儲值餘額低」這類通知。因為這是會員 App 該做的事：幫我記得我為何是會員。</p>
          <p>推播不是壞東西——亂推播才是。設定得當的會員系統 App，反而讓我覺得店還在用心經營常客關係。</p>
          <p class="letter-sign">—— 一個會看通知標題的人</p>
        </div>
        <aside class="letter-aside"><strong>給店東</strong>會員 App 推播是 retention 利器，關鍵在「與積分、儲值、生日相關」的實用訊息，而非每日促銷轟炸。</aside>
