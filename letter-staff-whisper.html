        <h1>櫃檯說的，跟 App 顯示一樣，我就信</h1>
        <div class="letter-body">
          <p>親愛的店老板：</p>
          <p>我信任有會員系統的店：員工說「您現在有八點」，我低頭看 App 也是八點——這種一致讓我敢繼續累積。以前紙卡加人工記，偶爾對不上，我會懷疑是不是白來。</p>
          <p>對顧客來說，會員系統 App 不只是後台，是「承諾的證明」。口徑統一，信任就來了。</p>
          <p class="letter-sign">—— 一個會看螢幕核對的人</p>
        </div>
        <aside class="letter-aside"><strong>給店東</strong>投資會員系統 App，能減少人工誤差與爭拗，讓熟客更願意長期累積——回訪率的基礎是信任。</aside>
